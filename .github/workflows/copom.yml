# Probabilidades do Copom: grava terminal/copom/copom.json com a curva DI x pré da B3 (Taxas de Swap),
# a Selic meta e o CDI do Banco Central, e as chances de cada decisão nos últimos pregões.
name: Probabilidades do Copom

on:
  schedule:
    - cron: '30 22 * * 1-5'
    - cron: '40 1 * * 2-6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: copom
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Curva de DI, Selic e CDI
        run: python3 terminal/copom/gerar_copom.py terminal/copom
      - name: Salvar no repositório
        run: |
          git config user.name "copom-bot"
          git config user.email "actions@users.noreply.github.com"
          p=terminal/copom/copom.json
          if git cat-file -e HEAD:$p 2>/dev/null && [ "$(git show HEAD:$p | python3 -c 'import json,sys;d=json.load(sys.stdin);d.pop("gerado",None);print(json.dumps(d,sort_keys=True))')" = "$(python3 -c 'import json,sys;d=json.load(open(sys.argv[1]));d.pop("gerado",None);print(json.dumps(d,sort_keys=True))' $p)" ]; then git checkout -q -- $p; fi
          git add $p
          if git diff --cached --quiet; then echo "Sem mudanças"; exit 0; fi
          git commit -m "Copom: $(TZ=America/Sao_Paulo date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push -q origin main && exit 0; sleep $((i*5)); done; exit 1
