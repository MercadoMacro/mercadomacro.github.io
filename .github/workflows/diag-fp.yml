name: diag-fp
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -o /dev/null -w "1a visita %{http_code}\n" https://mercadomacro.com.br/fechamento-do-mercado
          sleep 40
          curl -s https://mercadomacro.com.br/fechamento-do-mercado -o i.html -w "indice %{http_code}\n"; grep -o '<title>[^<]*' i.html; grep -o 'fechamento-do-mercado/20[0-9-]*' i.html | sort -u
          D=$(grep -o 'fechamento-do-mercado/20[0-9-]*' i.html | head -1)
          curl -s https://mercadomacro.com.br/$D -o d.html -w "dia %{http_code}\n"; grep -o '<title>[^<]*' d.html; grep -o '<p class="lead">[^<]*' d.html
          grep -o 'notícias do dia</h2><ul class="nots">.\{0,600\}' d.html | sed 's/<[^>]*>/ | /g' | head -c 700; echo
          curl -s https://mercadomacro.com.br/sitemap.xml | grep fechamento
