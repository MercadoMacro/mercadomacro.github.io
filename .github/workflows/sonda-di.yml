name: sonda-di
on: { push: { branches: [sonda-di] } }
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -A 'Mozilla/5.0' 'https://www2.bmf.com.br/pages/portal/bmfbovespa/lumis/lum-ajustes-do-pregao-ptBR.asp' -o aj.html; ls -la aj.html
          python3 - <<'PY'
          import re,html
          s=open('aj.html',encoding='latin1').read()
          t=re.sub(r'<[^>]+>','|',s); t=html.unescape(t); t=re.sub(r'\s+',' ',t); t=re.sub(r'(\|\s*)+','|',t)
          i=t.find('DI1'); print(t[:300]); print(t[i-200:i+2500])
          j=t.find('DAP'); print(t[j:j+1200])
          PY
