name: sonda-di
on: { push: { branches: [sonda-di] } }
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://cotacao.b3.com.br/mds/api/v1/DerivativeQuotation/DI1 http://cotacao.b3.com.br/mds/api/v1/DerivativeQuotation/DI1; do
            echo "== $u"; curl -s --max-time 20 -A 'Mozilla/5.0' "$u" -o d.json; python3 -c "import json;j=json.load(open('d.json'));print('Msg',j.get('Msg'));s=j.get('Scty',[]);print(len(s));print(json.dumps(s[1] if len(s)>1 else s)[:700])" || echo falhou
          done
          echo "== worker /di"; curl -s --max-time 20 "https://shrill-meadow-89c1.danilo-nillo.workers.dev/di" -H "Origin: https://mercadomacro.com.br" | head -c 600
