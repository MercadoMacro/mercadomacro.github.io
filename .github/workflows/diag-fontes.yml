name: diag-fontes
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="MercadoMacro contato@mercadomacro.com.br"
          echo "== VIX quote"; curl -s -m 20 -w "\nHTTP %{http_code}\n" https://cdn.cboe.com/api/global/delayed_quotes/quotes/_VIX.json | head -c 1500; echo
          echo "== VIX hist"; curl -s -m 20 https://cdn.cboe.com/api/global/us_indices/daily_prices/VIX_History.csv | (head -3; tail -3)
          echo "== CFTC legacy"; curl -s -m 30 -G "https://publicreporting.cftc.gov/resource/6dca-aqww.json" --data-urlencode "\$where=cftc_contract_market_code in('088691','067651','098662','102741','099741')" --data-urlencode "\$order=report_date_as_yyyy_mm_dd DESC" --data-urlencode "\$limit=5" --data-urlencode "\$select=market_and_exchange_names,cftc_contract_market_code,report_date_as_yyyy_mm_dd,noncomm_positions_long_all,noncomm_positions_short_all,open_interest_all,change_in_noncomm_long_all,change_in_noncomm_short_all" ; echo
          echo "== SEC sub"; curl -s -m 20 -A "$UA" https://data.sec.gov/submissions/CIK0001067983.json | python3 -c "import json,sys;d=json.load(sys.stdin);r=d['filings']['recent'];print(d['name']);[print(r['form'][i],r['filingDate'][i],r['accessionNumber'][i],r['primaryDocument'][i]) for i in range(len(r['form'])) if r['form'][i].startswith('13F')][:0] or [print(r['form'][i],r['filingDate'][i],r['accessionNumber'][i]) for i in range(len(r['form'])) if r['form'][i].startswith('13F')][:4]"
          ACC=$(curl -s -m 20 -A "$UA" https://data.sec.gov/submissions/CIK0001067983.json | python3 -c "import json,sys;r=json.load(sys.stdin)['filings']['recent'];print([r['accessionNumber'][i] for i in range(len(r['form'])) if r['form'][i]=='13F-HR'][0])")
          A=${ACC//-/}; echo "== SEC index $ACC"; curl -s -m 20 -A "$UA" "https://www.sec.gov/Archives/edgar/data/1067983/$A/index.json" | head -c 1500; echo
