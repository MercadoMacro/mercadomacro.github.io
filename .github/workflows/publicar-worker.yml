# Valida PRs e só publica o servidor de dados depois das verificações.
name: Publicar worker (Cloudflare)

on:
  push:
    branches: [main]
    paths:
      - 'terminal/worker/**'
      - 'terminal/validar.mjs'
      - '.github/workflows/publicar-worker.yml'
  pull_request:
    branches: [main]
    paths:
      - 'terminal/worker/**'
      - 'terminal/validar.mjs'
      - '.github/workflows/publicar-worker.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: publicar-worker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validar:
    name: Validar worker de dados
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Conferir todos os scripts do Worker
        run: node terminal/validar.mjs worker
      - name: Montar Worker sem publicar
        working-directory: terminal/worker
        run: npx --yes wrangler@4.149.0 deploy --dry-run --outdir "$RUNNER_TEMP/worker-validado"
      - name: Conferir limitadores no runtime local sem consultar provedores
        run: node terminal/worker/tests/smoke-runtime.mjs

  publicar:
    name: Publicar worker de dados
    needs: validar
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Conferir credenciais de publicação
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT_ID" ]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID. O Worker não foi publicado."
            exit 1
          fi
      - name: Publicar na Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: terminal/worker
          command: deploy
          wranglerVersion: '4.149.0'
