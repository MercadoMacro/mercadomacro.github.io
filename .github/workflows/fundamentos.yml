# Coloque este arquivo em .github/workflows/fundamentos.yml no repositório do GitHub
# (por exemplo MercadoMacro/mercadomacro.github.io) e o gerar_fundamentos.py em terminal/cvm/.
# Toda segunda às 6h (Brasília) ele baixa os balanços da CVM e atualiza a pasta terminal/fundamentos/.
name: Fundamentos (CVM)

on:
  schedule:
    - cron: '0 9 * * 1'      # segunda, 09:00 UTC = 06:00 em Brasília
  workflow_dispatch: {}       # botão "Run workflow" para rodar na hora

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Gerar JSON a partir da CVM
        run: python3 terminal/cvm/gerar_fundamentos.py terminal/fundamentos
      - name: Salvar no repositório
        run: |
          git config user.name "fundamentos-bot"
          git config user.email "actions@users.noreply.github.com"
          git add terminal/fundamentos
          if git diff --cached --quiet; then echo "Sem mudanças"; exit 0; fi
          git commit -m "Fundamentos: dados da CVM de $(date -u +%Y-%m-%d)"
          # outros robôs podem ter gravado ao mesmo tempo: junta e tenta de novo
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push -q origin main && exit 0; sleep $((i*5)); done; exit 1
