# Diagnóstico temporário: lista as moedas da Deriv e confere se os preços chegam ao vivo. Apagar depois.
name: Diag Deriv
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - run: |
          cat > d.mjs <<'JS'
          const ws = new WebSocket(process.env.URL);
          const send = (o) => ws.send(JSON.stringify(o));
          const ticks = {}; let fx = [];
          ws.onopen = () => send({ active_symbols: 'brief' });
          ws.onmessage = (e) => {
            const m = JSON.parse(e.data); if (m.msg_type !== 'tick') console.log('RESP', String(e.data).slice(0, 700));
            if (m.error) { console.log('ERRO', m.msg_type, m.error.message); return; }
            if (m.msg_type === 'active_symbols') {
              const lst = m.active_symbols || []; console.log('MERCADOS', [...new Set(lst.map(s => s.market))].join(',')); fx = lst.filter(s => s.market === 'forex').map(s => ({ ...s, symbol: s.symbol || s.underlying_symbol, display_name: s.display_name || s.underlying_symbol_name }));
              console.log('FOREX', fx.length);
              for (const s of fx) console.log(s.symbol, '|', s.display_name, '|', s.submarket, '| aberto', s.exchange_is_open);
              const want = fx.map(s => s.symbol).filter(s => /USD(BRL|MXN|ZAR|TRY|CNH|CNY|INR|CLP|COP|ARS)|BRL|MXN|ZAR/.test(s) || ['frxEURUSD','frxUSDJPY','frxAUDUSD'].includes(s));
              console.log('TESTANDO', want.join(','));
              for (const s of want) send({ ticks: s, subscribe: 1 });
              setTimeout(() => { console.log('TICKS em 25 s:'); for (const [k, v] of Object.entries(ticks)) console.log(k, v.n, 'ultimo', v.q, new Date(v.t * 1000).toISOString()); ws.close(); process.exit(0); }, 25000);
            }
            if (m.msg_type === 'tick') { const t = m.tick; const o = ticks[t.symbol] ||= { n: 0 }; o.n++; o.q = t.quote; o.t = t.epoch; }
          };
          ws.onerror = (e) => { console.log('ws erro', e.message); process.exit(0); };
          JS
          URL='wss://api.derivws.com/trading/v1/options/ws/public' node d.mjs || true
