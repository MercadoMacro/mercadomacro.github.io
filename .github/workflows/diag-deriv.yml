# Diagnóstico temporário: fechamento diário dos metais na Deriv. Apagar depois.
name: Diag Deriv
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - run: |
          cat > d.mjs <<'JS'
          const ws = new WebSocket('wss://api.derivws.com/trading/v1/options/ws/public');
          let n = 0;
          ws.onopen = () => { ws.send(JSON.stringify({ ticks_history: 'frxXAUUSD', style: 'candles', granularity: 86400, count: 3, end: 'latest', req_id: 1 }));
                              ws.send(JSON.stringify({ ticks_history: 'frxXAGUSD', style: 'candles', granularity: 86400, count: 3, end: 'latest', req_id: 2 })); };
          ws.onmessage = (e) => { console.log(String(e.data).slice(0, 900)); if (++n >= 2) process.exit(0); };
          setTimeout(() => process.exit(0), 15000);
          JS
          node d.mjs
