name: Teste fundamentos (temporario) 4
on:
  push:
    branches: [fundamentos-auditoria]
    paths: ['.github/workflows/teste-fund.yml']
permissions:
  contents: write
jobs:
  gerar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 terminal/cvm/gerar_fundamentos.py terminal/fundamentos
      - run: |
          git config user.name "fundamentos-bot"
          git config user.email "actions@users.noreply.github.com"
          git add terminal/fundamentos
          git commit -qm "Teste: fundamentos gerados na auditoria" && git push -q origin HEAD:fundamentos-auditoria
