# PIB dos EUA por componente (BEA). A BEA divulga o PIB trimestral às 8h30 de Nova York; sem dado novo, nada é gravado.
# A chave fica no segredo BEA_API_KEY do repositório.
name: PIB dos EUA (BEA)

on:
  schedule:
    - cron: '0 14 * * 1-5'    # 11h em Brasília
    - cron: '0 21 * * 1-5'    # 18h
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bea
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Ler a BEA
        env:
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
        run: python3 terminal/bea/gerar_bea.py terminal/bea
      - name: Salvar no repositório
        run: |
          git config user.name "bea-bot"
          git config user.email "actions@users.noreply.github.com"
          git add terminal/bea/bea.json
          if git diff --cached --quiet; then echo "Sem mudanças"; exit 0; fi
          git commit -m "BEA: $(TZ=America/Sao_Paulo date +%Y-%m-%d)"
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push -q origin main && exit 0; sleep $((i*5)); done; exit 1
