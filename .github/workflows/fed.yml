# Probabilidades do Fed (estilo FedWatch): grava terminal/fed/fed.json com o calendário do FOMC,
# a faixa da taxa, a Fed Funds efetiva e os futuros de Fed Funds (fechamentos dos últimos pregões).
# O site faz a conta no navegador com o preço ao vivo; este arquivo é a base e o reserva.
name: Probabilidades do Fed

on:
  # os horários do dia são disparados pelo site (worker station, ROBOS_HORA em src/index.js, segredo GH_TOKEN),
  # porque o agendador do GitHub atrasava horas; aqui fica só uma passagem de reserva de madrugada
  schedule:
    - cron: '50 4 * * 2-6'
  workflow_dispatch:
    inputs:
      agendado:
        description: 'Disparado pelo relógio do site (1); vazio quando rodado à mão'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: fed
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Calendário, taxas e futuros
        run: python3 terminal/fed/gerar_fed.py terminal/fed
      - name: Salvar no repositório
        run: |
          git config user.name "fed-bot"
          git config user.email "actions@users.noreply.github.com"
          p=terminal/fed/fed.json
          if git cat-file -e HEAD:$p 2>/dev/null && [ "$(git show HEAD:$p | python3 -c 'import json,sys;d=json.load(sys.stdin);d.pop("gerado",None);print(json.dumps(d,sort_keys=True))')" = "$(python3 -c 'import json,sys;d=json.load(open(sys.argv[1]));d.pop("gerado",None);print(json.dumps(d,sort_keys=True))' $p)" ]; then git checkout -q -- $p; fi
          git add $p
          if git diff --cached --quiet; then echo "Sem mudanças"; exit 0; fi
          git commit -m "Fed: $(TZ=America/Sao_Paulo date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push -q origin main && exit 0; sleep $((i*5)); done; exit 1
