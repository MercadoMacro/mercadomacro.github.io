# Teste da busca da Jade (AI Search): sincroniza as aulas, mostra a situação dos índices, guarda as notícias de agora
# ou faz uma busca, pela rota /api/robo/busca-teste do site. Não mexe na Jade nem manda nada a ninguém.
name: Teste da busca

on:
  workflow_dispatch:
    inputs:
      acao:
        description: 'O que fazer'
        type: choice
        options: [situacao, sincronizar, guardar, buscar]
        default: situacao
      q:
        description: 'Pergunta (só para buscar)'
        type: string
        default: 'o que é CDI'
      onde:
        description: 'Onde buscar'
        type: choice
        options: [tudo, aulas, noticias]
        default: tudo

permissions:
  contents: read
  id-token: write

jobs:
  teste:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Pedir ao site
        env:
          ACAO: ${{ inputs.acao }}
          Q: ${{ inputs.q }}
          ONDE: ${{ inputs.onde }}
        run: |
          TOK=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=mercadomacro-vigia" | jq -r .value)
          curl -sS -G -H "Authorization: Bearer $TOK" https://mercadomacro.com.br/api/robo/busca-teste \
            --data-urlencode "acao=$ACAO" --data-urlencode "q=$Q" --data-urlencode "onde=$ONDE" | jq .
