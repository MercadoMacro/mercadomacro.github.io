# Agenda de proventos: todo dia útil de manhã busca dividendos e JCP das empresas da aba Fundamentos
# na B3 e os avisos aos acionistas na CVM, e grava proventos/agenda.json para o site.
name: Agenda de proventos

on:
  schedule:
    - cron: '0 10 * * 1-5'    # segunda a sexta, 10:00 UTC = 07:00 em Brasília
    - cron: '0 22 * * 1-5'    # e de novo às 19:00, depois dos anúncios do dia
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: proventos
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Buscar proventos (B3) e avisos (CVM)
        run: python3 proventos/gerar_proventos.py proventos fundamentos/index.json
      - name: Salvar no repositório
        run: |
          git config user.name "proventos-bot"
          git config user.email "actions@users.noreply.github.com"
          git add proventos/agenda.json
          if git diff --cached --quiet; then echo "Sem mudanças"; exit 0; fi
          git commit -m "Proventos: agenda de $(TZ=America/Sao_Paulo date +%Y-%m-%d)"
          git pull --rebase -q origin main
          git push
