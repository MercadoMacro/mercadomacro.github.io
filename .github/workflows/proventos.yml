# Agenda de proventos: todo dia útil de manhã busca dividendos e JCP das empresas da aba Fundamentos
# na B3 e os avisos aos acionistas na CVM, e grava terminal/proventos/agenda.json para o site.
name: Agenda de proventos

on:
  # os horários do dia são disparados pelo site (worker station, ROBOS_HORA em src/index.js, segredo GH_TOKEN),
  # porque o agendador do GitHub atrasava horas; aqui fica só uma passagem de reserva de madrugada
  schedule:
    - cron: '15 5 * * 2-6'
  workflow_dispatch:
    inputs:
      agendado:
        description: 'Disparado pelo relógio do site (1); vazio quando rodado à mão'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: proventos
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Buscar proventos (B3) e avisos (CVM)
        run: python3 terminal/proventos/gerar_proventos.py terminal/proventos terminal/fundamentos/index.json
      - name: Salvar no repositório
        run: |
          git config user.name "proventos-bot"
          git config user.email "actions@users.noreply.github.com"
          git add terminal/proventos/agenda.json
          if git diff --cached --quiet; then echo "Sem mudanças"; exit 0; fi
          git commit -m "Proventos: agenda de $(TZ=America/Sao_Paulo date +%Y-%m-%d)"
          # outros robôs podem ter gravado ao mesmo tempo: junta e tenta de novo
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push -q origin main && exit 0; sleep $((i*5)); done; exit 1
