name: Teste leiloes (temporario)
on:
  push:
    branches: [leiloes-teste]
jobs:
  t:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          B=https://api.fiscaldata.treasury.gov/services/api/fiscal_service/v1/accounting/od/auctions_query
          F=record_date,auction_date,security_type,security_term,reopening,high_yield,high_investment_rate,high_discnt_rate,bid_to_cover_ratio,offering_amt,primary_dealer_accepted,direct_bidder_accepted,indirect_bidder_accepted,soma_accepted,comp_accepted,noncomp_accepted
          curl -s "$B?sort=-auction_date&page%5Bsize%5D=60&fields=$F&filter=auction_date:lte:2026-11-07" > a.json
          python3 -c "
          import json;d=json.load(open('a.json'))
          print(d.get('meta',{}).get('total-count'), d.get('error'), d.get('message'))
          for r in d.get('data',[]): print('|'.join(str(r.get(k)) for k in '$F'.split(',')))
          "
          echo ---- TD auctioned
          curl -s -A "Mozilla/5.0" "https://www.treasurydirect.gov/TA_WS/securities/auctioned?format=json&days=20" > t.json; head -c 300 t.json; echo
          python3 -c "
          import json;d=json.load(open('t.json'))
          print(len(d)); print(sorted(d[0].keys()))
          for r in d[:40]: print(r.get('auctionDate'),r.get('securityType'),r.get('securityTerm'),r.get('reopening'),r.get('highYield'),r.get('highInvestmentRate'),r.get('highDiscountRate'),r.get('bidToCoverRatio'),r.get('offeringAmount'),r.get('primaryDealerAccepted'),r.get('directBidderAccepted'),r.get('indirectBidderAccepted'),r.get('totalAccepted'),r.get('competitiveAccepted'),r.get('somaAccepted'),r.get('tips'),r.get('type'))
          "
          echo ---- TD upcoming
          curl -s -A "Mozilla/5.0" "https://www.treasurydirect.gov/TA_WS/securities/upcoming?format=json" > u.json
          python3 -c "
          import json;d=json.load(open('u.json'))
          print(len(d))
          for r in d: print(r.get('announcementDate'),r.get('auctionDate'),r.get('securityType'),r.get('securityTerm'),r.get('offeringAmount'),r.get('reopening'), r.get('closingTimeCompetitive'))
          "
