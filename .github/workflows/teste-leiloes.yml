name: Teste leiloes (temporario)
on:
  push:
    branches: [leiloes-teste]
jobs:
  t:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: |
          python3 terminal/leiloes/gerar_leiloes.py terminal/leiloes
          ls -la terminal/leiloes
          python3 -c "import json;d=json.load(open('terminal/leiloes/leiloes.json'));import collections;print(collections.Counter((x['tipo'],x['orig']) for x in d['leiloes']).most_common(40))"
          curl -s -A "Mozilla/5.0" -o /dev/null -w "pdf %{http_code} %{content_type}\n" https://www.treasurydirect.gov/instit/annceresult/press/preanre/2026/R_20261029_3.pdf
          base64 -w0 terminal/leiloes/leiloes.json | gzip -c | base64 -w0 > /dev/null
          gzip -c terminal/leiloes/leiloes.json | base64 -w0; echo
