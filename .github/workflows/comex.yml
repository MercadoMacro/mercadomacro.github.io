# Balança comercial (Comex Stat, MDIC): exportações e importações do Brasil por mês.
# O MDIC divulga o mês fechado na primeira semana do mês seguinte; sem dado novo, nada é gravado.
name: Balança comercial (Comex Stat)

on:
  schedule:
    - cron: '15 13 * * 1-5'   # 10:15 em Brasília
    - cron: '15 21 * * 1-5'   # 18:15
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: comex
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Ler o Comex Stat
        run: python3 terminal/comex/gerar_comex.py terminal/comex
      - name: Salvar no repositório
        run: |
          git config user.name "comex-bot"
          git config user.email "actions@users.noreply.github.com"
          git add terminal/comex/comex.json
          if git diff --cached --quiet; then echo "Sem mudanças"; exit 0; fi
          git commit -m "Comex: $(TZ=America/Sao_Paulo date +%Y-%m-%d)"
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push -q origin main && exit 0; sleep $((i*5)); done; exit 1
