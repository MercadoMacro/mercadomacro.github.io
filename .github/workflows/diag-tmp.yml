name: diag-tmp
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          js=$(curl -s "https://arquivos.b3.com.br/bdi/" | grep -o '/bdi/static/js/main[^"]*\.js' | head -1)
          curl -s "https://arquivos.b3.com.br$js" > b.js
          grep -o '[A-Za-z]*Api[A-Za-z]*\\\?"\?\s*:\s*\\\?"[^"\\]\{3,120\}' b.js | sort -u | head -20
          grep -o 'https://[a-z0-9./-]*b3[a-z0-9./_-]*' b.js | sort -u | head -30
          grep -o '.\{0,60\}[Pp]articipa[^"\\]\{0,60\}' b.js | sort -u | head -15
          grep -o '"/[a-zA-Z]*/table/[^"\\]\{0,80\}\|table/[A-Za-z]\{3,40\}' b.js | sort -u | head -30
