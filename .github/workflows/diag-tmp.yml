name: diag-tmp
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s https://data.jsdelivr.com/v1/package/npm/chart.js | head -c 300; echo
          curl -sI https://cdn.jsdelivr.net/npm/chart.js | grep -i "location\|x-jsd\|content-location" || true
          curl -s https://cdn.jsdelivr.net/npm/chart.js | head -c 200; echo
          for v in 4.4.1 4.5.0 4.5.1; do echo -n "chart $v: "; curl -s -o /dev/null -w "%{http_code} %{size_download}\n" https://cdn.jsdelivr.net/npm/chart.js@$v/dist/chart.umd.min.js; done
          for v in 6.5.1 6.5.2 6.7.2; do echo -n "fa $v: "; curl -s -o fa$v.css -w "%{http_code} %{size_download}\n" https://cdnjs.cloudflare.com/ajax/libs/font-awesome/$v/css/all.min.css; done
          for i in adjust arrow-right balance-scale bell bitcoin bolt book-open bookmark broom building bullseye calculator calendar-alt calendar-week chart-area chart-bar chart-line check chess-knight chevron-down chevron-left chevron-right chevron-up circle clipboard-list clock cog compass compress copy crosshairs database desktop dice download eraser exchange-alt expand external-link-alt file-export file-invoice-dollar fire globe-americas graduation-cap hand-holding-usd house-user image industry info-circle landmark language layer-group lightbulb list minus moon newspaper oil-can paper-plane pen percentage piggy-bank plus quote-left redo search shield-alt star sticky-note sun sync-alt table th th-large times umbrella-beach undo upload wave-square whatsapp window-maximize; do grep -q "\.fa-$i[:,{]" fa6.5.1.css || echo "FALTA 6.5.1: $i"; grep -q "\.fa-$i[:,{]" fa6.7.2.css || echo "FALTA 6.7.2: $i"; done; echo fim
