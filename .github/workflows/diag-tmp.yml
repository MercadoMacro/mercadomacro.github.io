name: diag-tmp
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1 || true
          for d in 2026-10-09 2026-10-08 2026-10-07; do
            n=$(echo $d | tr -d -)
            code=$(curl -s -o bdi$n.pdf -w "%{http_code}" "https://arquivos.b3.com.br/bdi/download/bdi/$d/BDI_02_$n.pdf"); echo "BDI_02 $d -> $code $(stat -c %s bdi$n.pdf 2>/dev/null)"
          done
          f=$(ls -S bdi*.pdf | head -1); pdftotext -layout $f t.txt && grep -n -i -B3 -A25 "estrangeir" t.txt | head -120
          echo ==== pagina app
          curl -s "https://arquivos.b3.com.br/bdi/" | head -c 1500; echo
          curl -s "https://www.b3.com.br/pt_br/market-data-e-indices/servicos-de-dados/market-data/consultas/boletim-diario/boletim-diario-do-mercado/" | grep -o 'https\?://[^"]*bdi[^"]*' | sort -u | head
