name: diag-tmp
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "== NS público"; dig +short NS mercadomacro.com.br @8.8.8.8
          echo "== NS no registro .br"; dig +short NS mercadomacro.com.br @a.dns.br
          for h in mercadomacro.com.br www.mercadomacro.com.br webmail.mercadomacro.com.br; do echo "== $h na Cloudflare"; dig +short $h @lily.ns.cloudflare.com; done
          echo "== MX na Cloudflare"; dig +short MX mercadomacro.com.br @lily.ns.cloudflare.com
          for u in https://www.mercadomacro.com.br/ https://mercadomacro.com.br/; do
            ip=$(dig +short www.mercadomacro.com.br @lily.ns.cloudflare.com | tail -1)
            echo "== $u (pela Cloudflare, ip $ip)"; host=$(echo $u | cut -d/ -f3)
            curl -s -o /tmp/b -w "%{http_code} %{redirect_url}\n" --resolve $host:443:$ip $u; grep -o "Pedir acesso" /tmp/b | head -1
          done
          echo "== mercadomacro.github.io"; curl -s -o /dev/null -w "%{http_code} %{redirect_url}\n" https://mercadomacro.github.io/
