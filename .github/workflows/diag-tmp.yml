name: diag-tmp
on: workflow_dispatch
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm i --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          cat > s.mjs <<'JS'
          import { chromium } from 'playwright';
          const br = await chromium.launch();
          for (const [n, vp, m] of [['d', { width: 1440, height: 900 }, false], ['m', { width: 390, height: 844 }, true]]) {
            const ctx = await br.newContext({ viewport: vp, isMobile: m, deviceScaleFactor: 1 });
            const pg = await ctx.newPage(); const errs = [];
            pg.on('pageerror', (e) => errs.push(e.message)); pg.on('console', (c) => { if (c.type() === 'error') errs.push(c.text()); });
            await pg.goto('https://station.danilo-nillo.workers.dev/', { waitUntil: 'load' });
            await pg.waitForTimeout(9000);
            await pg.screenshot({ path: `live-${n}-1.png` });
            await pg.evaluate(() => document.querySelectorAll('.rv').forEach((e) => e.classList.add('in')));
            await pg.evaluate(() => document.getElementById('ao-vivo').scrollIntoView());
            await pg.waitForTimeout(1500);
            await pg.screenshot({ path: `live-${n}-2.png` });
            console.log(n, pg.url(), JSON.stringify(errs));
          }
          await br.close();
          JS
          node s.mjs
          git config user.name diag && git config user.email diag@users.noreply.github.com
          git checkout -b diag-shots && git add -f live-*.png && git commit -qm shots && git push -qf origin diag-shots
