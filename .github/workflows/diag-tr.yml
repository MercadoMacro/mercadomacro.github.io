name: diag-tr
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -D - -o b.txt -H 'Origin: https://mercadomacro.com.br' 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=pt&dt=t&q=Gold%20holds%20loss%0AFed%20will%20hike' | grep -iE '^(HTTP|access-control)'; head -c 300 b.txt; echo
          curl -s -X OPTIONS -D - -o /dev/null -H 'Origin: https://mercadomacro.com.br' -H 'Access-Control-Request-Method: GET' 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=pt&dt=t&q=x' | grep -iE '^(HTTP|access-control)'
          curl -s -D - -o /dev/null https://news.cota-cotacao10.workers.dev/ | grep -iE '^(HTTP|x-|access|cache)'
