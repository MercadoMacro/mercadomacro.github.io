# Leilões do Tesouro dos EUA (TreasuryDirect, sem chave). O resultado sai por volta das 13h de Nova York;
# as rodadas pegam o resultado do dia e a agenda dos próximos. Sem mudança, nada é gravado.
name: Leilões do Tesouro dos EUA

on:
  schedule:
    - cron: '10 11 * * 1-5'   # 8h10 em Brasília: agenda do dia
    - cron: '20 18 * * 1-5'   # logo depois do resultado (13h em Nova York no horário de inverno)
    - cron: '20 17 * * 1-5'   # idem no horário de verão
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: leiloes
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Ler a TreasuryDirect
        run: python3 terminal/leiloes/gerar_leiloes.py terminal/leiloes
      - name: Salvar no repositório
        run: |
          git config user.name "leiloes-bot"
          git config user.email "actions@users.noreply.github.com"
          git add terminal/leiloes/leiloes.json
          if git diff --cached --quiet; then echo "Sem mudanças"; exit 0; fi
          git commit -m "Leilões do Tesouro: $(TZ=America/Sao_Paulo date +%Y-%m-%d)"
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push -q origin main && exit 0; sleep $((i*5)); done; exit 1
