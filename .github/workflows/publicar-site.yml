# Valida PRs e só publica na Cloudflare depois que todas as verificações passam.
name: Publicar site (Cloudflare)

on:
  push:
    branches: [main]
    paths:
      - 'terminal/station/**'
      - 'terminal/validar.mjs'
      - '.github/workflows/publicar-site.yml'
  pull_request:
    branches: [main]
    paths:
      - 'terminal/station/**'
      - 'terminal/validar.mjs'
      - '.github/workflows/publicar-site.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: publicar-site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validar:
    name: Validar site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Conferir scripts, recursos e testes
        run: node terminal/validar.mjs site
      - name: Preparar verificação do gráfico em navegador
        run: |
          npm install --prefix "$RUNNER_TEMP/mm-browser" --no-save --package-lock=false playwright@1.56.1 lightweight-charts@5.0.9
          node "$RUNNER_TEMP/mm-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Conferir Lightweight Charts em Chromium
        env:
          MM_BROWSER_MODULES: ${{ runner.temp }}/mm-browser/node_modules
          MM_BROWSER_OUTPUT: ${{ runner.temp }}/mm-browser-images
        run: node terminal/station/tests/asset-history-browser.mjs
      - name: Conferir prévia cripto em Chromium
        env:
          MM_BROWSER_MODULES: ${{ runner.temp }}/mm-browser/node_modules
          MM_BROWSER_OUTPUT: ${{ runner.temp }}/mm-browser-images
        run: node terminal/station/tests/crypto-live-browser.mjs
      - name: Guardar imagem da verificação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lightweight-charts-preview
          path: ${{ runner.temp }}/mm-browser-images
          if-no-files-found: ignore
      - name: Montar Worker sem publicar
        working-directory: terminal/station
        run: npx --yes wrangler@4.149.0 deploy --dry-run --outdir "$RUNNER_TEMP/site-validado"

  publicar:
    name: Publicar site
    needs: validar
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Conferir credenciais de publicação
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT_ID" ]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID. O site não foi publicado."
            exit 1
          fi
      - name: Publicar na Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: terminal/station
          command: deploy
          wranglerVersion: '4.149.0'
