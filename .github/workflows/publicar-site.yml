# Publicação automática na Cloudflare: cada mudança em terminal/station/ enviada ao GitHub vai para o ar.
# Precisa de dois segredos do repositório (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN  token da Cloudflare com o modelo "Edit Cloudflare Workers"
#   CLOUDFLARE_ACCOUNT_ID ID da conta (aparece na página inicial do painel da Cloudflare)
# Sem o token, o robô só avisa e não publica nada.
name: Publicar site (Cloudflare)

on:
  push:
    branches: [main]
    paths:
      - 'terminal/station/**'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: publicar-site
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Conferir os arquivos (erro de sintaxe não vai para o ar)
        working-directory: terminal/station
        run: for f in site/*.js; do node --check "$f"; done; cp src/index.js "$RUNNER_TEMP/porteiro.mjs" && node --check "$RUNNER_TEMP/porteiro.mjs"; test -s site/index.html
      - name: Conferir o token
        id: token
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::Falta o segredo CLOUDFLARE_API_TOKEN no repositório. Nada foi publicado."
            echo "ok=0" >> "$GITHUB_OUTPUT"
          else
            echo "ok=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Publicar na Cloudflare
        if: steps.token.outputs.ok == '1'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: terminal/station
          command: deploy
          wranglerVersion: '4.149.0'
