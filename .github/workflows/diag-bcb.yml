name: diag-bcb
on:
  push:
    paths: ['.github/workflows/diag-bcb.yml']
jobs:
  t:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          curl -sS -m 30 -w "\nHTTP %{http_code}\n" "https://api.bcb.gov.br/dados/serie/bcdata.sgs.432/dados/ultimos/1?formato=json" | head -c 700; echo
          curl -sS -m 30 -w "\nHTTP %{http_code}\n" "https://api.bcb.gov.br/dados/serie/bcdata.sgs.432/dados?formato=json&dataInicial=01/10/2026&dataFinal=13/10/2026" | head -c 300; echo
