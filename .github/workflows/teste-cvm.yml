name: Teste CVM insiders
on: { push: { branches: [teste-cvm] } }
permissions: { contents: write }
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          git fetch -q origin main && git show origin/main:terminal/fundamentos/index.json > /tmp/fund.json
          python3 terminal/insiders/gerar_insiders.py terminal/insiders /tmp/fund.json
          git config user.name "teste" && git config user.email "actions@users.noreply.github.com"
          git add terminal/insiders/insiders.json && git commit -qm "teste: insiders.json" && git push -q
