name: Teste CVM insiders
on: { push: { branches: [teste-cvm] } }
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          git fetch -q origin main && git show origin/main:terminal/fundamentos/index.json > /tmp/fund.json
          python3 terminal/insiders/gerar_insiders.py /tmp/ins /tmp/fund.json
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/ins/insiders.json'))
          print('meses', d['meses'][:2], d['meses'][-3:], 'parciais', d['parciais'], 'entregas', d['entregas'][-4:])
          print('ibov', d['ibov'][-4:])
          for g in ('ctl','adm'):
              print(g, 'ultimos', d['tot'][g][-6:], 'soma liq bi', round(sum(c-v for c,v in d['tot'][g])/1e6,1))
          print('setores', d['setores'])
          e = d['emp']; print('emp', len(e), e[:3])
          print('ops', d['ops'][:5])
          PY
      - uses: actions/upload-artifact@v4
        with: { name: insiders, path: /tmp/ins/insiders.json }
