# Resumo do fechamento: em dia de pregão, às 18h de Brasília, manda no Telegram do administrador
# Ibovespa, dólar, juros e o fluxo do estrangeiro, com os números do próprio site (terminal/resumo/resumo.mjs).
# Em feriado da B3 não manda nada. A mensagem passa pelo site (https://mercadomacro.com.br/api/vigia),
# que confere o token OIDC que o GitHub assina para este robô; não há senha guardada.
name: Resumo do fechamento

on:
  schedule:
    - cron: '0 21 * * 1-5'      # 18:00 de Brasília, segunda a sexta
    # o agendador do GitHub às vezes atrasa horas ou pula a execução: estas são repescagens
    # (só mandam se ainda não saiu nenhum resumo hoje)
    - cron: '40 21 * * 1-5'
    - cron: '30 22 * * 1-5'
    - cron: '30 23 * * 1-5'
  workflow_dispatch:
    inputs:
      forcar:
        description: 'Mandar mesmo sem pregão hoje (teste)'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: resumo
  cancel-in-progress: false

jobs:
  resumo:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Já saiu hoje?
        id: ja
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HOJE=$(TZ=America/Sao_Paulo date +%Y-%m-%d)
          N=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/resumo.yml/runs?status=success&per_page=10" \
            --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID) | select((.created_at | fromdateiso8601 - 10800 | strftime(\"%Y-%m-%d\")) == \"$HOJE\")] | length")
          echo "Resumos já mandados hoje: $N"
          [ "$N" = "0" ] || echo "pular=1" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        if: steps.ja.outputs.pular != '1'
      - uses: actions/setup-node@v5
        if: steps.ja.outputs.pular != '1'
        with:
          node-version: '22'
      - name: Montar o resumo
        if: steps.ja.outputs.pular != '1'
        env:
          FORCAR: ${{ inputs.forcar }}
          RESUMO_OUT: ${{ runner.temp }}/resumo.txt
        run: node terminal/resumo/resumo.mjs
      - name: Mandar no Telegram
        if: steps.ja.outputs.pular != '1'
        env:
          RESUMO_OUT: ${{ runner.temp }}/resumo.txt
        run: |
          [ -s "$RESUMO_OUT" ] || { echo "Nada para mandar."; exit 0; }
          TOK=$(curl -sS -m 20 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=mercadomacro-vigia" | jq -r '.value // empty')
          R=$(curl -sS -m 30 -X POST https://mercadomacro.com.br/api/vigia -H "Authorization: Bearer $TOK" -H 'Content-Type: application/json' \
            --data "$(jq -n --rawfile t "$RESUMO_OUT" '{texto: $t}')")
          echo "$R"
          echo "$R" | grep -q '"ok":true'
