name: diag-fluxo
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-24.04
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils >/dev/null
      - run: |
          for d in 2026-10-14 2026-10-13; do
            y=${d//-/}
            curl -sS -m 200 -A 'Mozilla/5.0' -o b.pdf -w "$d %{http_code} %{size_download}\n" "https://arquivos.b3.com.br/bdi/download/bdi/$d/BDI_02_$y.pdf"
            pdftotext -layout b.pdf b.txt; wc -l b.txt
            grep -n -i "acumulados do in\|Participa..o dos investidores\|Investidor Estrangeiro" b.txt | head -20
            L=$(grep -n -i "Investidor Estrangeiro" b.txt | head -1 | cut -d: -f1); [ -n "$L" ] && sed -n "$((L-15)),$((L+8))p" b.txt | cat -A | cut -c1-220
          done
