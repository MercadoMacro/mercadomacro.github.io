name: diag-redir
on:
  push:
    paths: ['.github/workflows/diag-redir.yml']
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sleep 120
          for u in https://mercadomacro.github.io/ https://mercadomacro.github.io/indicadores.html https://mercadomacro.github.io/sw.js; do echo "== $u"; curl -sS -w "\nHTTP %{http_code}\n" "$u" | head -c 600; echo; done
