# Histórico diário: depois do fechamento guarda a curva do Tesouro, o Focus e os fechamentos
# da Mesa em terminal/historico/*.json. O site lê esses arquivos para mostrar períodos mais longos.
name: Histórico diário

on:
  schedule:
    - cron: '30 22 * * 1-5'   # segunda a sexta, 22:30 UTC = 19:30 em Brasília
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: historico
  cancel-in-progress: false

jobs:
  gravar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Gerar histórico
        run: python3 terminal/historico/gerar_historico.py terminal/historico
      - name: Salvar no repositório
        run: |
          git config user.name "historico-bot"
          git config user.email "actions@users.noreply.github.com"
          git add terminal/historico/*.json
          if git diff --cached --quiet; then echo "Sem mudanças"; exit 0; fi
          git commit -m "Histórico: dados de $(TZ=America/Sao_Paulo date +%Y-%m-%d)"
          git pull --rebase -q origin main
          git push
