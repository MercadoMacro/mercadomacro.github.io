name: tmp auditoria vitrine
on:
  push:
    branches: [auditoria-vitrine]
    paths: [terminal/tmp-audit/sonda.sh, .github/workflows/tmp-audit-vitrine.yml]
permissions:
  contents: write
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p terminal/tmp-audit/out
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: bash terminal/tmp-audit/sonda.sh 2>&1 | tee terminal/tmp-audit/out/sonda.txt
      - run: |
          git config user.name "auditoria" && git config user.email "actions@users.noreply.github.com"
          git add -f terminal/tmp-audit/out && git commit -qm "saida auditoria vitrine" && git push -q
