name: diag-fx
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          npm i --no-save --no-package-lock playwright@1.56.1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > s.js <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const br = await chromium.launch();
            const pg = await br.newPage({ viewport: { width: 1440, height: 1000 }, locale: 'pt-BR' });
            const reqs = [];
            pg.on('response', r => { const u = r.url(); if (/json|api/i.test(r.headers()['content-type'] || '') || /api/.test(u)) reqs.push(r.status() + ' ' + u); });
            await pg.goto('https://fluxos.investfy.com/?tab=chart&period=ytd&investor=foreigners&chart=column&ma=28', { waitUntil: 'networkidle', timeout: 60000 });
            await pg.waitForTimeout(4000);
            console.log('REQS\n' + reqs.join('\n'));
            console.log('TEXT\n' + (await pg.innerText('body')).slice(0, 6000));
            const b = (await pg.screenshot({ fullPage: true, type: 'jpeg', quality: 55 })).toString('base64');
            for (let i = 0; i < b.length; i += 3000) console.log('Z B64:' + b.slice(i, i + 3000));
            const opts = await pg.evaluate(() => [...document.querySelectorAll('button,select,option,[role=tab],a')].map(e => (e.innerText || e.value || '').trim()).filter(Boolean).slice(0, 200));
            console.log('OPTS ' + JSON.stringify(opts));
            await br.close();
          })();
          JS
          node s.js
