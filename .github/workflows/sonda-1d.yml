name: sonda-1d
on: { push: { branches: [sonda-1d] } }
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -m 40 -H "Origin: https://mercadomacro.com.br" -H "Referer: https://mercadomacro.com.br/" "https://shrill-meadow-89c1.danilo-nillo.workers.dev/history?symbols=DX-Y.NYB,BZ=F,%5EBVSP,%5EGSPC&r=1d" > h.json; head -c 300 h.json; echo
          jq -c 'to_entries[] | {k: .key, n: (.value.c|length?), t0: (.value.t[0]? | todate?), t1: (.value.t[-1]? | todate?), e: .value.error?}' h.json || true
