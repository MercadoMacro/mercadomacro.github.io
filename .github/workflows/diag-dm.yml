name: diag-dm
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          set +e
          curl -sS -m 60 https://arquivos.b3.com.br/bdi/config.js | grep -i -E "serverUrl|url" | head
          curl -sS -m 60 https://arquivos.b3.com.br/bdi/static/js/main.e591a35328ff179145c0.js -o j.js
          grep -o -E 'config\.serverUrl \+ \\"/table/\\" \+[^;]{0,300}' j.js | head -3
          grep -o -E '.{0,200}/table/\\".{0,400}' j.js | head -4
