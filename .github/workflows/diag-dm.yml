name: diag-dm
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          set +e
          B=https://arquivos.b3.com.br/bdi
          curl -sS -m 60 "$B/table/classifications" -o c.json
          jq -r '..|objects|select(has("tables"))|.tables|to_entries[]|.value|select((.friendlyNamePt+.name)|test("nvestid|articipa";"i"))|[.name,.friendlyNamePt,.defaultDate,.limitDate]|@tsv' c.json
          for N in $(jq -r '..|objects|select(has("tables"))|.tables|to_entries[]|.value|select((.friendlyNamePt+.name)|test("nvestid|articipa";"i"))|.name' c.json | sort -u); do
            for d in 2026-10-14 2026-10-13; do
              echo "== $N $d GET"; curl -sS -m 60 "$B/table/$N/$d/$d/1/50" | head -c 1500; echo
              echo "== $N $d POST"; curl -sS -m 60 -X POST -H 'Content-Type: application/json' -d '{}' "$B/table/$N/$d/$d/1/50" | head -c 1500; echo
            done
          done
