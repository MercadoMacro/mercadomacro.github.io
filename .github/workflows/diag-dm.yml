name: diag-dm
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          set +e
          B=https://arquivos.b3.com.br/bdi
          for d in 2026-10-15 2026-10-14 2026-10-09 2026-10-01; do
            curl -sS -m 60 -X POST -H 'Content-Type: application/json' -d '{}' "$B/table/SharesInvesVolum/$d/$d/1/50" -o t.json
            echo "== $d $(wc -c < t.json)"; jq -c 'del(.table.columns)|.table.values=(.table.values|length)' t.json | head -c 1200; echo
            grep -o -E '[0-9]{2}/[0-9]{2}/20[0-9]{2}' t.json | sort -u | head
          done
          curl -sS -m 60 "$B/table/workday?date=2026-10-14"; echo; curl -sS -m 60 "$B/table/workdays?date=2026-10-14" | head -c 400; echo
