name: diag-dm
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          curl -sS -m 60 -A 'Mozilla/5.0' -w "\nHTTP %{http_code}\n" https://www.dadosdemercado.com.br/fluxo -o p.html; tail -c 100 p.html; echo
          sed 's/<[^>]*>/ /g' p.html | tr -s ' \n' | grep -o -i -E "[0-9]{2}/[0-9]{2}/20[0-9]{2}[^|]{0,120}" | head -15
