name: diag-focus
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          for u in "/focus" "/focus?full=1"; do
            curl -s -D h.txt -o f.json -H "Origin: https://mercadomacro.com.br" "https://shrill-meadow-89c1.danilo-nillo.workers.dev$u"
            echo "== $u"; grep -i "x-reserva\|cache\|age\|date:" h.txt
            python3 -c "import json;d=json.load(open('f.json'));print('max Data', max(r['Data'] for r in d['anuais']), 'ts', d.get('ts'))"
          done
          curl -s "https://olinda.bcb.gov.br/olinda/servico/Expectativas/versao/v1/odata/ExpectativasMercadoAnuais?\$top=5&\$format=json&\$orderby=Data%20desc&\$select=Indicador,Data,DataReferencia,Mediana&\$filter=Indicador%20eq%20'IPCA'%20and%20baseCalculo%20eq%200" | head -c 800
