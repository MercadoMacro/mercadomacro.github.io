name: diag-trad
on: workflow_dispatch
permissions: { id-token: write, contents: read }
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          TOK=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=mercadomacro-vigia" | jq -r .value)
          curl -s -m 120 -H "Authorization: Bearer $TOK" https://mercadomacro.com.br/api/robo/traduzir; echo
          curl -s -m 120 -H "Authorization: Bearer $TOK" https://mercadomacro.com.br/api/robo/traduzir; echo
          curl -s -m 120 -H "Authorization: Bearer $TOK" https://mercadomacro.com.br/api/robo/fechamento | jq -c '.noticias'
