name: Teste atraso de feeds
on: { push: { branches: [teste-fj] } }
permissions: {}
jobs:
  t:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - run: |
          cat > t.mjs <<'JS'
          const F = {
            fj: 'https://www.financialjuice.com/feed.ashx?xy=rss',
            mw: 'https://feeds.content.dowjones.io/public/rss/mw_realtimeheadlines',
            fxlive: 'https://www.forexlive.com/feed',
            invlive: 'https://investinglive.com/feed',
            fxstreet: 'https://www.fxstreet.com/rss/news',
            investing: 'https://www.investing.com/rss/news_25.rss',
            bloomberg: 'https://feeds.bloomberg.com/markets/news.rss',
            cnbc: 'https://www.cnbc.com/id/100003114/device/rss/rss.html',
            wsj: 'https://feeds.content.dowjones.io/public/rss/RSSMarketsMain',
          };
          const UA = 'Mozilla/5.0 (compatible; TraderDashboard/1.0)';
          const visto = {}, stats = {};
          const itens = (x) => [...x.matchAll(/<item[\s\S]*?<\/item>/g)].map((m) => ({ t: (m[0].match(/<title>(?:<!\[CDATA\[)?([\s\S]*?)(?:\]\]>)?<\/title>/) || [])[1], d: Date.parse((m[0].match(/<pubDate>([^<]+)<\/pubDate>/) || [])[1] || '') }));
          for (let r = 0; r < 18; r++) {
            const agora = Date.now();
            await Promise.all(Object.entries(F).map(async ([k, u]) => {
              const s = stats[k] ||= { ok: 0, fail: 0, novos: [], hdr: null, primeira: null };
              try {
                const res = await fetch(u + (u.includes('?') ? '&' : '?') + '_=' + agora, { headers: { 'User-Agent': UA, 'Cache-Control': 'no-cache' }, signal: AbortSignal.timeout(10000) });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                if (!s.hdr) s.hdr = ['age', 'cache-control', 'cf-cache-status', 'x-cache', 'last-modified', 'server'].map((h) => h + '=' + res.headers.get(h)).join(' ');
                const l = itens(await res.text()); s.ok++;
                if (r === 0) s.primeira = { n: l.length, maisNova: l.length ? Math.round((agora - Math.max(...l.map((x) => x.d).filter(Number.isFinite))) / 60000) + ' min' : '-' };
                const v = visto[k] ||= new Set();
                for (const it of l) { const key = it.t; if (!v.has(key)) { if (r > 0 && Number.isFinite(it.d)) s.novos.push(Math.round((agora - it.d) / 1000)); v.add(key); } }
              } catch (e) { s.fail++; s.err = String(e.message).slice(0, 60); }
            }));
            await new Promise((ok) => setTimeout(ok, 30000));
          }
          for (const [k, s] of Object.entries(stats)) console.log(k.padEnd(10), 'ok', s.ok, 'falhas', s.fail, s.err || '', '| itens', s.primeira?.n, 'mais nova', s.primeira?.maisNova, '| novos (atraso em s):', s.novos.slice(0, 15).join(','), '\n    ', s.hdr);
          JS
          node t.mjs
