name: diag-di
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in "https://www.bcb.gov.br/api/servico/sitebcb/copomcomunicados/ultimas?quantidade=6&filtro=" "https://www.bcb.gov.br/api/servico/sitebcb/copomminutes/ultimas?quantidade=4&filtro=" "https://www.bcb.gov.br/api/servico/sitebcb/copom/comunicados?quantidade=4"; do echo "== $u"; curl -s -m 20 -A "Mozilla/5.0" -H "Accept: application/json" "$u" | head -c 900; echo; done
          curl -s -m 60 -A "Mozilla/5.0" "https://www.b3.com.br/pesquisapregao/download?filelist=TS261015.ex_," -o ts.zip
          python3 - <<'P'
          import zipfile,io
          z=zipfile.ZipFile('ts.zip'); z2=zipfile.ZipFile(io.BytesIO(z.read(z.namelist()[0])))
          for l in z2.read('TaxaSwap.txt').decode('latin1').splitlines():
              if 'PRE' in l[:45] and 'DIxPRE' in l: print(l)
          P
