name: diag-di
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -m 60 "https://arquivos.b3.com.br/bdi/config.js" | head -c 7000; echo
          curl -s -m 60 "https://arquivos.b3.com.br/bdi/static/js/main.e591a35328ff179145c0.js" -o m.js
          grep -o '.\{200\}bdi/table.\{300\}' m.js | head -3
          grep -o '.\{100\}/table/.\{200\}' m.js | head -5
