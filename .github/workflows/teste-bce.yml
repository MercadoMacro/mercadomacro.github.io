name: Teste BCE (temporario)
on:
  push:
    branches: [europa-bce]
jobs:
  t:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: python3 terminal/bce/gerar_bce.py terminal/bce
      - uses: actions/upload-artifact@v4
        with: { name: bce, path: terminal/bce/bce.json }
