name: Teste BCE (temporario)
on:
  push:
    branches: [europa-bce]
jobs:
  t:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          A=https://data-api.ecb.europa.eu/service/data
          for k in "ICP/M.U2.N..4.ANR" "ICP/M.U2...." "MNA/Q.Y..W2.S1.S1.B.B1GQ._Z._Z._Z.EUR.LR.GY" "MNA/Q.Y.I9.W2.S1.S1.B.B1GQ._Z._Z._Z.EUR.LR."; do
            echo "== $k"; curl -s --max-time 150 "$A/$k?format=csvdata&startPeriod=2026-01&detail=dataonly" | awk -F, '{print $1","$(NF-1)","$NF}' | sort -u -t, -k1,1 | head -60
          done
