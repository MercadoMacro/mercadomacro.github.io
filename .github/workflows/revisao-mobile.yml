name: Revisão visual mobile
on:
  pull_request:
    paths:
      - 'terminal/station/site/**'
      - 'terminal/station/tests/responsive-browser.mjs'
      - '.github/workflows/revisao-mobile.yml'
permissions:
  contents: read
jobs:
  revisar:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Preparar Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/mm-browser" --no-save --package-lock=false playwright@1.56.1
          node "$RUNNER_TEMP/mm-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Fotografar todas as abas nos dois temas e orientações
        env:
          MM_BROWSER_MODULES: ${{ runner.temp }}/mm-browser/node_modules
          MM_BROWSER_OUTPUT: ${{ runner.temp }}/mobile-review
        run: node terminal/station/tests/responsive-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-review
          path: ${{ runner.temp }}/mobile-review
