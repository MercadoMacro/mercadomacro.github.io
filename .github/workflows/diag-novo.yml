name: diag-novo
on:
  push:
    paths: ['.github/workflows/diag-novo.yml']
jobs:
  ver:
    runs-on: ubuntu-24.04
    steps:
      - run: sleep 150
      - run: |
          H='-H Accept:text/html -H Sec-Fetch-Mode:navigate -H User-Agent:diag'
          for u in /calculadora-renda-fixa /calculadora-juros-compostos /calculadora-aposentadoria /indicadores-hoje; do curl -s -o p.html $H -w "$u %{http_code} " "https://mercadomacro.com.br$u"; grep -o '<title>[^<]*' p.html | head -1; done
          for f in ferramentas.js ferramentas.css calc-jc.js calc-ap.js indicadores-hoje.js; do curl -s -o /dev/null -w "$f %{http_code}\n" "https://mercadomacro.com.br/vitrine/$f?v=1"; done
          curl -s https://mercadomacro.com.br/sitemap.xml | grep -c '<loc>'
          curl -s -o /dev/null -w "focus raw %{http_code}\n" https://raw.githubusercontent.com/MercadoMacro/mercadomacro.github.io/main/terminal/historico/focus.json
          curl -s -H "Origin: https://mercadomacro.com.br" "https://mercadomacro-vitrine.cota-cotacao10.workers.dev/bcb?c=189&n=12" | head -c 200; echo
