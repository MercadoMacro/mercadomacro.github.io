name: diag-novo
on:
  push:
    paths: ['.github/workflows/diag-novo.yml']
jobs:
  ver:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          curl -s -H Accept:text/html -H User-Agent:diag https://mercadomacro.com.br/ > p.html
          echo "link css: $(grep -c 'href="/vitrine/vitrine.css' p.html) style: $(grep -c '<style>/\* Mercado Macro' p.html) bytes: $(wc -c < p.html)"
