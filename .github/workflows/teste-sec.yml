name: Teste ranking EUA (temporario)
on:
  push:
    branches: [ranking-eua]
    paths: ['.github/workflows/teste-sec.yml', 'terminal/sec/gerar_ranking_eua.py']
permissions:
  contents: write
jobs:
  gerar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 terminal/sec/gerar_ranking_eua.py terminal/sec
      - run: |
          git config user.name "sec-bot"
          git config user.email "actions@users.noreply.github.com"
          git add terminal/sec/ranking_eua.json
          git commit -qm "Teste: ranking EUA" && git push -q origin HEAD:ranking-eua
