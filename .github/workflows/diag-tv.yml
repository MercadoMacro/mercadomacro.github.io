name: diag-tv
on:
  push:
    paths: ['.github/workflows/diag-tv.yml']
jobs:
  tv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: |
          npm i --no-save --no-package-lock playwright@1.56.1 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          cat > s.mjs <<'X'
          import { chromium } from 'playwright';
          const b = await chromium.launch(); const p = await b.newPage({ viewport: { width: 390, height: 1400 }, isMobile: true });
          await new Promise((r) => setTimeout(r, 150000)); await p.goto('https://mercadomacro.com.br/indicadores-hoje'); await p.evaluate(() => document.getElementById('tv-mercado').scrollIntoView()); await p.waitForTimeout(12000);
          for (const f of p.frames()) { console.log('FRAME', f.url().slice(0, 80)); try { const t = await f.evaluate(() => document.body.innerText); console.log(t.slice(0, 1500)); } catch (e) { console.log('erro', e.message.slice(0, 100)); } }
          await p.screenshot({ path: 'tv.jpg', type: 'jpeg', quality: 45 }); await b.close();
          X
          node s.mjs
          echo B64START; base64 -w0 tv.jpg; echo; echo B64END
