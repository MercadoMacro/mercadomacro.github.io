name: sonda
on: { push: { branches: [sonda-perps] } }
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - shell: bash {0}
        run: |
          for id in BOPGSTB BOPTEXP BOPTIMP; do echo "== $id"; curl -s -m 30 "https://fred.stlouisfed.org/graph/fredgraph.csv?id=$id&cosd=2000-01-01" | tr '\n' ' '; echo; done
