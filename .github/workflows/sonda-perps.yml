name: sonda
on: { push: { branches: [sonda-eua], paths: ['.github/workflows/sonda-perps.yml'] } }
permissions: { contents: write }
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - shell: bash {0}
        run: |
          mkdir -p sonda-dados
          for id in BOPGSTB BOPTEXP BOPTIMP; do curl -s -m 30 "https://fred.stlouisfed.org/graph/fredgraph.csv?id=$id&cosd=1990-01-01" > sonda-dados/$id.csv; done
          git config user.name sonda; git config user.email sonda@users.noreply.github.com
          git add sonda-dados && git commit -qm "dados sonda" && git push -q origin HEAD:sonda-eua
