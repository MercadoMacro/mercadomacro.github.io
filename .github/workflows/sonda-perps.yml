name: sonda-perps
on:
  push:
    branches: [sonda-perps]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -H "Origin: https://mercadomacro.com.br" "https://shrill-meadow-89c1.danilo-nillo.workers.dev/quotes?symbols=6L%3DF,BRL%3DX" | jq -c 'to_entries[] | {s:.key, m:(.value.chart.result[0].meta | {regularMarketPrice,chartPreviousClose,previousClose,regularMarketTime,exchangeName,shortName}), n:(.value.chart.result[0].timestamp|length)}'
          date -u
