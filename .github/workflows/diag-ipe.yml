name: Diagnóstico IPE (temporário)
on:
  push:
    branches: [balancos-br-ipe]
    paths: ['terminal/balancos-br/diag_ipe.py']
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: python3 terminal/balancos-br/diag_ipe.py
