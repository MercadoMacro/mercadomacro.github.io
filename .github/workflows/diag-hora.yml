name: diag-hora
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1 || true
          for d in 2026-10-14 2026-10-13 2026-10-09 2026-10-08; do
            y=${d//-/}; echo "== $d"
            curl -sS -I -m 60 -A 'Mozilla/5.0' "https://arquivos.b3.com.br/bdi/download/bdi/$d/BDI_02_$y.pdf" | grep -i -E "last-modified|date:|etag|content-length"
            curl -sS -m 200 -A 'Mozilla/5.0' -o b.pdf "https://arquivos.b3.com.br/bdi/download/bdi/$d/BDI_02_$y.pdf"; pdfinfo b.pdf | grep -i -E "date|pages"
          done
