name: diag-psi
on:
  push:
    paths: ['.github/workflows/diag-psi.yml']
jobs:
  lh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: lighthouse
        run: |
          for s in mobile desktop; do
            P=""; [ $s = desktop ] && P="--preset=desktop"
            npx -y lighthouse@12 https://mercadomacro.com.br/ $P --chrome-flags="--headless=new --no-sandbox" --output=json --output-path=lh-$s.json --quiet --only-categories=performance,accessibility,best-practices,seo || true
            echo "== $s"
            jq -r '(.categories | to_entries[] | "\(.key) \((.value.score*100)|round)"), (.audits | to_entries[] | select(.key|IN("first-contentful-paint","largest-contentful-paint","total-blocking-time","cumulative-layout-shift","speed-index")) | "\(.key) \(.value.displayValue)")' lh-$s.json
            echo "-- abaixo de 90%:"
            jq -r '.audits | to_entries[] | select(.value.score != null and .value.score < 0.9 and (.value.scoreDisplayMode|IN("binary","numeric","metricSavings"))) | "\(.key) \(.value.score) \(.value.displayValue // "") \(.value.title)"' lh-$s.json | head -40
          done
          echo "== detalhes mobile"
          jq -r '.audits | to_entries[] | select(.key|IN("largest-contentful-paint-element","render-blocking-resources","render-blocking-insight","lcp-discovery-insight","image-delivery-insight","color-contrast","unused-css-rules","unused-javascript","uses-responsive-images","uses-optimized-images","modern-image-formats","font-display","font-display-insight","layout-shifts","cls-culprits-insight","network-dependency-tree-insight")) | "## \(.key)\n" + ((.value.details.items // []) | map(tostring[0:300]) | .[0:6] | join("\n"))' lh-mobile.json
