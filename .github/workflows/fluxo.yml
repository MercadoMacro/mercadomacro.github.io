# Fluxo de investidores na B3: todo dia útil lê o Boletim Diário da B3 (PDF) e grava
# terminal/fluxo/fluxo.json com o saldo de compras menos vendas de estrangeiros, institucionais,
# pessoas físicas e demais, por dia e por mês. A B3 publica com cerca de 2 pregões de atraso.
# Fonte principal: a tabela em JSON do site do BDI; o PDF (BDI_02) fica de reserva.
name: Fluxo de investidores (B3)

on:
  # os horários do dia são disparados pelo site (worker station, ROBOS_HORA em src/index.js, segredo GH_TOKEN),
  # porque o agendador do GitHub atrasava horas; aqui fica só uma passagem de reserva de madrugada
  schedule:
    - cron: '55 4 * * 2-6'
  workflow_dispatch:
    inputs:
      agendado:
        description: 'Disparado pelo relógio do site (1); vazio quando rodado à mão'
        required: false
        default: ''
      dias:
        description: 'Quantos dias para trás buscar (primeira carga: 300)'
        required: false
        default: '12'

permissions:
  contents: write

concurrency:
  group: fluxo
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      # o dado do dia já foi gravado por uma passagem anterior: as outras passagens agendadas do dia param aqui
      # (rodar à mão continua sempre buscando)
      - name: Já tem o dado de hoje?
        id: hoje
        if: github.event_name == 'schedule' || github.event.inputs.agendado == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          desde=$(TZ=America/Sao_Paulo date +%Y-%m-%dT00:00:00-03:00)
          n=$(gh api "repos/${{ github.repository }}/commits?path=terminal/fluxo/fluxo.json&since=$desde&per_page=5" --jq '[.[] | select(.commit.message | startswith("Fluxo B3:"))] | length' || echo 0)
          if [ "${n:-0}" -gt 0 ]; then echo "Dado de hoje já gravado; nada a fazer até amanhã."; echo "pular=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v5
        if: steps.hoje.outputs.pular != '1'
      - name: Instalar o leitor de PDF
        if: steps.hoje.outputs.pular != '1'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils >/dev/null
      - name: Ler os boletins da B3
        if: steps.hoje.outputs.pular != '1'
        env:
          DIAS: ${{ github.event.inputs.dias || '12' }}
        run: |
          # o valor digitado à mão vai por variável (nunca colado no comando) e só aceita número
          if ! [[ "$DIAS" =~ ^[0-9]{1,3}$ ]]; then echo "dias inválido: $DIAS"; exit 1; fi
          python3 terminal/fluxo/gerar_fluxo.py terminal/fluxo "$DIAS"
      - name: Salvar no repositório
        if: steps.hoje.outputs.pular != '1'
        run: |
          git config user.name "fluxo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add terminal/fluxo/fluxo.json
          if git diff --cached --quiet; then echo "Sem mudanças"; exit 0; fi
          git commit -m "Fluxo B3: $(TZ=America/Sao_Paulo date +%Y-%m-%d)"
          # outros robôs podem ter gravado ao mesmo tempo: junta e tenta de novo
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push -q origin main && exit 0; sleep $((i*5)); done; exit 1
