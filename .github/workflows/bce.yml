# Indicadores da zona do euro (BCE e Eurostat, sem chave) para a área Europa da aba Indicadores.
# O BCE publica as taxas e o câmbio de referência por volta das 16h de Frankfurt; Eurostat solta inflação e PIB às 11h de lá.
name: Europa (BCE e Eurostat)

on:
  # os horários do dia são disparados pelo site (worker station, ROBOS_HORA em src/index.js, segredo GH_TOKEN),
  # porque o agendador do GitHub atrasava horas; aqui fica só uma passagem de reserva de madrugada
  schedule:
    - cron: '25 4 * * 2-6'
  workflow_dispatch:
    inputs:
      agendado:
        description: 'Disparado pelo relógio do site (1); vazio quando rodado à mão'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: bce
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Ler BCE e Eurostat
        run: python3 terminal/bce/gerar_bce.py terminal/bce
      - name: Salvar no repositório
        run: |
          git config user.name "bce-bot"
          git config user.email "actions@users.noreply.github.com"
          git add terminal/bce/bce.json
          if git diff --cached --quiet; then echo "Sem mudanças"; exit 0; fi
          git commit -m "Europa (BCE): $(TZ=America/Sao_Paulo date +%Y-%m-%d)"
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push -q origin main && exit 0; sleep $((i*5)); done; exit 1
