name: diag-feeds
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cp terminal/station/src/noticias.js /tmp/n.mjs
          echo 'export { fetchOneFeed };' >> /tmp/n.mjs
          cat > /tmp/t.mjs <<'X'
          const { fetchOneFeed } = await import('/tmp/n.mjs');
          const L = [
            ['Bloomberg Línea', 'https://www.bloomberglinea.com.br/arc/outboundfeeds/rss.xml'],
            ['Bloomberg BR', 'https://www.bloomberg.com.br/feed/'],
            ['Money Times', 'https://www.moneytimes.com.br/feed/'],
            ['Suno', 'https://www.suno.com.br/noticias/feed/'],
            ['InvestNews', 'https://investnews.com.br/feed/'],
            ['BMC News', 'https://bmcnews.com.br/feed/'],
            ['Valor Investe', 'https://pox.globo.com/rss/valorinveste/'],
            ['Valor pox', 'http://pox.globo.com/rss/valor'],
            ['InfoMoney ultimas', 'https://www.infomoney.com.br/ultimas-noticias/feed/'],
            ['BBC Brasil', 'https://feeds.bbci.co.uk/portuguese/rss.xml'],
            ['investingLive', 'https://investinglive.com/feed'],
            ['Crude Oil Trader', 'http://feeds.feedburner.com/TheCrudeOilTrader'],
          ];
          const agora = Date.now();
          for (const [name, url] of L) {
            const f = { name, url, source: name, weight: 5 };
            let st = '-';
            try { const r = await fetch(url, { headers: { 'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36' } }); st = r.status; } catch (e) { st = 'ERRO'; }
            const it = await fetchOneFeed(f);
            const novo = it.length ? ((agora - Math.max(...it.map(n => n.data))) / 36e5).toFixed(1) : '-';
            const h48 = it.filter(n => agora - n.data < 48 * 36e5).length;
            const txt = it.filter(n => n.trecho).length, img = it.filter(n => n.imagem).length;
            console.log(`FEED|${name}|${st}|${it.length}|${h48}|${novo}|txt ${txt}|img ${img}|${(it[0]||{}).titulo||''}`.slice(0, 220));
          }
          X
          node /tmp/t.mjs
