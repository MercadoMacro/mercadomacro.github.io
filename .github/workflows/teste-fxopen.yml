# Teste da API pública da FXOpen (TickTrader), 13/11/2026: só leitura, sem chave. Roda ao enviar o ramo teste-fxopen.
name: Teste FXOpen
on:
  push:
    branches: [teste-fxopen]
permissions:
  contents: read
jobs:
  testar:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Catálogo de símbolos por tipo
        run: |
          B=https://ttlivewebapi.fxopen.net/api/v2/public
          curl -s -m 30 "$B/symbol" -o /tmp/s.json
          python3 - <<'PY'
          import json, collections
          d = [x for x in json.load(open('/tmp/s.json')) if not x['Symbol'].endswith('_L')]
          print('símbolos sem _L:', len(d))
          print('campos de um símbolo:', json.dumps(d[300], ensure_ascii=False)[:1500])
          for campo in ('SecurityName', 'SecurityDescription', 'StatusGroupId', 'MarginMode', 'ProfitCurrency', 'MarginCurrency'):
              print(campo, collections.Counter(str(x.get(campo)) for x in d).most_common(25))
          PY
      - name: Lote de ações e ETFs
        run: |
          B=https://ttlivewebapi.fxopen.net/api/v2/public
          L="AAPL MSFT NVDA AMZN GOOGL META TSLA NFLX AMD JPM SPY QQQ IWM EWZ GLD TLT XLE XLF ARKK VALE"
          Q=$(echo $L | sed 's/ /%20/g')
          curl -s -m 20 -w "\nHTTP %{http_code} · %{time_total}s\n" "$B/tick/$Q" -o /tmp/t.json
          python3 -c "import json;[print(x['Symbol'],x.get('BestBid',{}).get('Price'),x.get('BestAsk',{}).get('Price'),x.get('TickType')) for x in json.load(open('/tmp/t.json'))]"
          T=$(($(date +%s)*1000))
          curl -s -m 20 "$B/quotehistory/AAPL/D1/bars/bid?timestamp=$T&count=-2"; echo
