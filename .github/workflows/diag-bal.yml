name: diag-bal
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "== CVM DOC"; curl -s -m 30 https://dados.cvm.gov.br/dados/CIA_ABERTA/DOC/ | grep -o 'href="[A-Z_]*/"' | tr '\n' ' '; echo
          echo "== ITR 2026"; curl -s -m 120 -o itr.zip https://dados.cvm.gov.br/dados/CIA_ABERTA/DOC/ITR/DADOS/itr_cia_aberta_2026.zip; unzip -l itr.zip | tail -3; unzip -p itr.zip itr_cia_aberta_2026.csv | iconv -f latin1 -t utf8 | head -3; unzip -p itr.zip itr_cia_aberta_2026.csv | iconv -f latin1 -t utf8 | cut -d';' -f4,5,8 | sort -t';' -k1 | tail -5; unzip -p itr.zip itr_cia_aberta_2026.csv | iconv -f latin1 -t utf8 | awk -F';' '{print $4}' | sort | uniq -c | tail -5
          echo "== IPE 2026"; curl -s -m 120 -o ipe.zip https://dados.cvm.gov.br/dados/CIA_ABERTA/DOC/IPE/DADOS/ipe_cia_aberta_2026.zip; unzip -p ipe.zip | iconv -f latin1 -t utf8 | head -1; unzip -p ipe.zip | iconv -f latin1 -t utf8 | grep -i "calend" | head -3; unzip -p ipe.zip | iconv -f latin1 -t utf8 | grep -i "divulga.*resultado" | tail -5
          echo "== Investing earnings BR"; curl -s -m 30 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36" -H "X-Requested-With: XMLHttpRequest" -H "Content-Type: application/x-www-form-urlencoded" -w "\nHTTP %{http_code}\n" --data "country%5B%5D=32&dateFrom=2026-10-14&dateTo=2026-11-14&currentTab=custom&limit_from=0" https://br.investing.com/earnings-calendar/Service/getCalendarFilteredData | head -c 1500; echo
          echo "== Nasdaq earnings? skip"; echo "== Finnhub demo"; curl -s -m 20 "https://finnhub.io/api/v1/calendar/earnings?from=2026-10-14&to=2026-11-14&symbol=PBR" | head -c 300; echo
