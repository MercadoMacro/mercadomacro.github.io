name: Sonda futuros B3 (temporária)
on:
  push:
    branches: [sonda-futb3]
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for i in 1 2 3; do
            for b in https http; do
              for t in WINZ26 WDOX26 ISPZ26; do
                echo "$b $t $(curl -s -A 'Mozilla/5.0' -H 'Referer: https://www.b3.com.br/' "$b://cotacao.b3.com.br/mds/api/v1/InstrumentQuotation/$t" | jq -c '[.Msg.dtTm, .Trad[0].scty.SctyQtn.curPrc, .Trad[0].scty.SctyQtn.prcFlcn, .Trad[0].scty.SctyQtn.opngPric]')"
              done
            done
            sleep 8
          done
