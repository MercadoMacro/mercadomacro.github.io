name: Sonda futuros B3 (temporária)
on:
  push:
    branches: [sonda-futb3]
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          cd terminal/worker
          (npx --yes wrangler@4 dev --port 8799 > w.log 2>&1 &)
          for i in $(seq 1 60); do curl -s -o /dev/null localhost:8799/ && break; sleep 2; done
          curl -s -H "Origin: https://mercadomacro.com.br" localhost:8799/futb3 | jq -c '.f[] | {s, t, aj, ref, var: (if .t and .ref then ((.t/.ref-1)*10000|round/100) else null end)}'
          for t in BGIX26 CCMF27 SJCX26 ICFZ26 ETHX26 BITV26; do echo "$t $(curl -s -A 'Mozilla/5.0' "https://cotacao.b3.com.br/mds/api/v1/InstrumentQuotation/$t" | jq -c '[.Trad[0].scty.SctyQtn.curPrc, .Trad[0].scty.SctyQtn.prcFlcn]')"; done
