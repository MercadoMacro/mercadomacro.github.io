# Publica o worker da busca da Jade (terminal/busca) e manda as aulas novas ou alteradas para o AI Search.
name: Publicar busca (Cloudflare)

on:
  push:
    branches: [main]
    paths:
      - 'terminal/busca/**'
      - 'terminal/station/site/educacao-conteudo.js'
      - '.github/workflows/publicar-busca.yml'
  pull_request:
    branches: [main]
    paths:
      - 'terminal/busca/**'
      - 'terminal/station/site/educacao-conteudo.js'
      - '.github/workflows/publicar-busca.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: publicar-busca-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Gerar as aulas a partir da aba Educação
        run: node terminal/busca/gerar-aulas.mjs
      - name: Montar sem publicar
        working-directory: terminal/busca
        run: npx --yes wrangler@4.149.0 deploy --dry-run --outdir "$RUNNER_TEMP/busca-validada"
      - name: Conferir credenciais de publicação
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT_ID" ]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID. A busca não foi publicada."
            exit 1
          fi
      - name: Publicar na Cloudflare
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: terminal/busca
          command: deploy
          wranglerVersion: '4.149.0'
