name: diag-gb
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          for u in / /calculadora-renda-fixa /calculadora-juros-compostos /calculadora-aposentadoria /indicadores-hoje /privacidade; do
            curl -sS -m 30 -A 'Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)' -o b.html "https://mercadomacro.com.br$u" -w "$u HTTP %{http_code} %{content_type} " ; grep -o -i '<meta name="robots"[^>]*>' b.html | head -1; echo
          done
