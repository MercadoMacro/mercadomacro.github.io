name: diag-tes
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -m 30 "https://shrill-meadow-89c1.danilo-nillo.workers.dev/tesouro" -H "Origin: https://mercadomacro.com.br" -D - | head -c 900; echo
          echo ---- direto
          curl -s -m 30 -A "Mozilla/5.0" -o t.csv -w "%{http_code} %{size_download}\n" "https://www.tesourodireto.com.br/documents/d/guest/rendimento-investir-csv?download=true"; head -c 400 t.csv | iconv -f latin1 -t utf-8; echo
