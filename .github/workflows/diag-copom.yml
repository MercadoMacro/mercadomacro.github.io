name: diag copom
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          B=https://arquivos.b3.com.br/charts/chart
          H=(-sS -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/130 Safari/537.36' -H 'Referer: https://arquivos.b3.com.br/charts/copom?lang=pt' -H 'Accept: application/json')
          for D in 2026-10-15 2026-10-16; do
            echo "== meetings $D"; curl "${H[@]}" -w ' [%{http_code}]\n' "$B/meetings/$D" | head -c 1500; echo
            echo "== selic $D"; curl "${H[@]}" -w ' [%{http_code}]\n' "$B/selic/$D" | head -c 300; echo
          done
          M=$(curl "${H[@]}" "$B/meetings/2026-10-15" | python3 -c 'import json,sys;j=json.load(sys.stdin);print(" ".join(x["dateRef"] for x in j))' || true)
          echo "M=$M"
          for R in $M; do
            echo "== copom $R"; curl "${H[@]}" "$B/copom/2026-10-15/$R" | head -c 2500; echo
            echo "== copom qt20 $R"; curl "${H[@]}" "$B/copom/2026-10-15/$R?qt=20" | head -c 1500; echo
            echo "== intraday $R"; curl "${H[@]}" "$B/intraday/2026-10-15/$R" | head -c 1200; echo
            break
          done
