name: diag copom
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          B=https://arquivos.b3.com.br/charts
          curl -sSL -A 'Mozilla/5.0' $B/config.js | head -c 5300; echo
          curl -sSL -A 'Mozilla/5.0' $B/static/js/main.c09dd75c.chunk.js -o m.js
          python3 - <<'P'
          import re
          s=open('m.js').read()
          for k in ['relativeUrl','chart/copom','fetch(']:
              for m in list(re.finditer(re.escape(k),s))[:8]:
                  print('##',k, s[max(0,m.start()-300):m.start()+300].replace('\n',' '))
          P
