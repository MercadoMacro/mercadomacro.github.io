name: Diagnóstico RAD (temporário)
on:
  push:
    branches: [diag-rad]
    paths: ['.github/workflows/diag-rad.yml']
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: |
          for i in 1 2 3 4 5 6; do
            curl -sS -o /tmp/n.json -D /tmp/h.txt -w "pedido $i: HTTP %{http_code} em %{time_total}s, %{size_download} bytes, " https://news.cota-cotacao10.workers.dev/
            grep -i '^x-cache' /tmp/h.txt | tr -d '\r'; echo " itens: $(jq length /tmp/n.json 2>/dev/null)"
            sleep 3
          done
          sleep 35
          curl -sS -o /dev/null -D /tmp/h.txt -w "depois de 35s: %{time_total}s " https://news.cota-cotacao10.workers.dev/; grep -i '^x-cache' /tmp/h.txt
          curl -sS -o /dev/null -D /tmp/h.txt -w "logo em seguida: %{time_total}s " https://news.cota-cotacao10.workers.dev/; grep -i '^x-cache' /tmp/h.txt
