name: Diagnóstico RAD (temporário)
on:
  push:
    branches: [diag-rad]
    paths: ['.github/workflows/diag-rad.yml']
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: |
          curl -sSL -m 20 -o /tmp/n.html https://capital.com/en-int/news
          grep -oE 'href="/en-int/markets/[^"]+"' /tmp/n.html | sort -u | head -40
          curl -sSL -m 20 -o /tmp/s.xml https://capital.com/sitemap.xml -w "sitemap %{http_code}\n"; head -c 600 /tmp/s.xml; echo
          for U in https://capital.com/en-int/markets/etfs https://capital.com/en-int/markets/shares/spy-share-price https://capital.com/en-int/markets/etfs/spy https://capital.com/en-int/markets/etfs/spy-etf-price; do
            curl -sSL -m 20 -o /tmp/g.html -w "$U %{http_code} %{url_effective}\n" "$U"
            grep -oE 'href="/en-int/markets/[^"]*(spy|qqq|ewz|etf)[^"]*"' -i /tmp/g.html | sort -u | head -15
          done
