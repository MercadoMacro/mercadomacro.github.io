name: Diagnóstico RAD (temporário)
on:
  push:
    branches: [diag-rad]
    paths: ['.github/workflows/diag-rad.yml']
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: |
          U='https://www.rttnews.com/rss/rssarticlelist.aspx'
          curl -sSL -m 20 -o /tmp/f.html -D /tmp/h.txt -w "HTTP %{http_code} %{size_download} bytes\n" "$U" || echo falhou
          grep -i "^content-type" /tmp/h.txt | tail -1
          head -c 400 /tmp/f.html | tr '\n' ' '; echo
          echo "itens: $(grep -o '<item' /tmp/f.html | wc -l)"
          grep -o '<pubDate>[^<]*' /tmp/f.html | head -3
          grep -o '<title>[^<]*' /tmp/f.html | sed -n '1,5p'
          grep -oi 'href="[^"]*rss[^"]*"' /tmp/f.html | sort -u | head -60
