name: Diagnóstico RAD (temporário)
on:
  push:
    branches: [diag-rad]
    paths: ['.github/workflows/diag-rad.yml']
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: |
          curl -sSL -m 20 https://capital.com/sitemap.xml | grep -oE 'https://capital.com/sitemap-en-int-instruments-[0-9]+\.xml' | sort -u > /tmp/l.txt; cat /tmp/l.txt
          for S in $(cat /tmp/l.txt); do curl -sSL -m 30 "$S"; done > /tmp/all.xml
          grep -oE '<loc>[^<]+' /tmp/all.xml | sed 's/<loc>//' > /tmp/u.txt; wc -l /tmp/u.txt
          for T in spy qqq oneq dia iwm vti voo xlk smh xlf xle xlv ewz eem efa tlt ief lqd hyg gld slv uso vnq vgk ewg ewu epp ewj ewy ewt ewa bkf fxi inda; do
            echo "== $T: $(grep -iE "/(${T}|.*-${T})(-[a-z-]*)?$" /tmp/u.txt | grep -iE "share|etf" | head -2 | tr '\n' ' ')"
          done
          grep -iE "s-p-500-etf|spdr" /tmp/u.txt | head -8
