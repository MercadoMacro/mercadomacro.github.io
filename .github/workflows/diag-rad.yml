name: Diagnóstico RAD (temporário)
on:
  push:
    branches: [diag-rad]
    paths: ['.github/workflows/diag-rad.yml']
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: |
          for U in https://capital.com/en-int/news https://capital.com/en-int/news/rss https://capital.com/rss https://capital.com/en-int/analysis/rss; do
            curl -sSL -m 20 -o /tmp/g.html -D /tmp/h.txt -w "$U: HTTP %{http_code} %{size_download} bytes\n" "$U" || echo falhou
            grep -i "^content-type" /tmp/h.txt | tail -1
            grep -oiE '<link[^>]+(rss|atom)[^>]*>' /tmp/g.html | head -3
            grep -oE '"(https?:)?//[a-z0-9.-]*capital\.com/[^"]*(api|news|feed)[^"]*"' /tmp/g.html | sort -u | head -15
            grep -oE '<item' /tmp/g.html | wc -l | sed 's/^/itens /'
            grep -o 'Reuters News' /tmp/g.html | wc -l | sed 's/^/reuters /'
            grep -oE '__NEXT_DATA__|window\.__[A-Z_]+' /tmp/g.html | sort -u | head
          done
