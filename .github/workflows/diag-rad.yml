name: Diagnóstico RAD (temporário)
on:
  push:
    branches: [diag-rad]
    paths: ['.github/workflows/diag-rad.yml']
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: |
          for U in https://www.barchart.com/news/rss/financials https://www.barchart.com/news/rss/commodities https://www.barchart.com/news/rss/stocks; do
            curl -sSL -m 20 -o /tmp/g.xml -D /tmp/h.txt -w "$U: HTTP %{http_code} %{size_download} bytes, " "$U" || echo falhou
            echo "itens $(grep -o '<item' /tmp/g.xml | wc -l)"
            grep -i "^content-type" /tmp/h.txt | tail -1
            head -c 160 /tmp/g.xml | tr '\n' ' '; echo
            grep -o '<pubDate>[^<]*' /tmp/g.xml | head -2
            grep -o '<title>[^<]*' /tmp/g.xml | sed -n '2,3p'
            grep -o '<description>' /tmp/g.xml | wc -l | sed 's/^/descricoes /'
          done
