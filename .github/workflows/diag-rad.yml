name: Diagnóstico RAD (temporário)
on:
  push:
    branches: [diag-rad]
    paths: ['.github/workflows/diag-rad.yml']
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: |
          for P in spdr-s-p-500-etf-share-price-1 ishares-msci-brazil-capped-etf-share-price; do
            curl -sSL -m 20 -o /tmp/p.html -w "$P %{http_code}\n" "https://capital.com/en-int/markets/shares/$P"
            grep -oE '<title>[^<]*' /tmp/p.html
            echo "news words: $(grep -oiE 'Reuters|GlobeNewswire|Latest news|related news' /tmp/p.html | sort | uniq -c | tr '\n' ' ')"
          done
