name: Diagnóstico RAD (temporário)
on:
  push:
    branches: [diag-rad]
    paths: ['.github/workflows/diag-rad.yml']
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, sparse-checkout: terminal/station/src }
      - run: |
          U='https://www.noticiasagricolas.com.br/widgets/noticias?subsecao=163,14,80,84,32,213,218,164,117,118,214&qtd=30&output=js'
          curl -sS -o /tmp/na.js -w "HTTP %{http_code} %{size_download} bytes\n" "$U"
          head -c 2500 /tmp/na.js; echo; echo ----
          grep -o 'na_dia[^<]*<' /tmp/na.js | head
          printf '%s\n' "import { widgetNaParaRss } from './terminal/station/src/noticias.js';" "import fs from 'fs';" "const x = widgetNaParaRss(fs.readFileSync('/tmp/na.js','utf8'));" "const it = [...x.matchAll(/<pubDate>([^<]*)<\/pubDate>/g)].map(m=>m[1]);" "console.log('itens', it.length, 'primeiro', it[0], 'ultimo', it[it.length-1]);" > t.mjs
          node t.mjs
