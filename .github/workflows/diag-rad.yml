name: Diagnóstico RAD (temporário)
on:
  push:
    branches: [diag-rad]
    paths: ['.github/workflows/diag-rad.yml']
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: |
          for N in breakingnews Todaystop USMarketUpdate EconomicNews ForexTopStory Earnings HotStocks; do
            U="https://www.rttnews.com/RSS/$N.xml"
            curl -sSL -m 20 -o /tmp/g.xml -D /tmp/h.txt -w "$N: HTTP %{http_code} %{size_download} bytes, " "$U" || echo falhou
            echo "itens $(grep -o '<item' /tmp/g.xml | wc -l)"
            grep -o '<pubDate>[^<]*' /tmp/g.xml | head -2
            grep -o '<title>[^<]*' /tmp/g.xml | sed -n '2,3p'
            grep -o '<description>' /tmp/g.xml | wc -l | sed 's/^/descricoes /'
          done
